schema_version: 2
id: new_model
name: "SM + <what>"
parents:
  - {id: sm, relation: extends}      # or {id: sm, relation: replaces_sector, sector: higgs}
problem_addressed: |
  <one paragraph; mark physics judgment>
new_fields:
  - name: X
    symbol: "X"
    spin: "0"                          # "0" | "1/2" | "1"
    su3: 1
    su2: 1
    u1y: "0"                           # rational string
    extra_charges: [{group: Z2, kind: discrete, charge: "1"}]
    real: true
    chirality: null                    # fermions: L | R | Majorana
    generations: 1
new_symmetries:
  - {name: Z2, kind: discrete, acts_on: [X], status: exact, broken_by: ""}
free_parameters:
  - {name: lam_X, tex: "\\lambda_X", mass_dim: 0, role: coupling}
benchmark:
  description: "<where the numbers come from; inputs, not measurements>"
  inputs:
    gw: 0.65322889878251
    g1: 0.3491928465111313
    gs: 1.2177157847767197
    v: 246.2184581018163
    MH: 125.0
    MT: 173.0
    MB: 4.7
    MTA: 1.777
    WZ: 2.4952
    WW: 2.0850
    WH: 0.00407
    WT: 1.4915
  placeholders: []                     # names of inputs that are not physical (e.g. guessed widths)
key_results:
  - {statement: "<formula>", test: "tests/test_levels.py::test_l1_spectrum"}
maturity_level: 0
maturity_evidence:
  L0: ["tests/test_levels.py::test_l0_validate"]
  L1: []
  L2: []
  L3: []
  L4: []
slow_evidence: []                      # required (non-empty) at L4
literature_checks: []                  # required at L2: {quantity, ref, location: {equation|table|section|note}, source_version, checked_on, test}
discrepancies: []                      # {id: D-n, quantity, ref, location, ours, theirs, status: open|resolved|convention, test?, note}
references:
  - key: someone2020
    kind: article
    authors: "A. Author"
    title: "TODO(verify)"
    venue: null
    year: null
    arxiv: null
    inspire: null                      # required (or doi) once cited by a literature check at L2+
    doi: null
    verified_against: none
    conventions_map: []
feynlag_gaps: []                       # {id: FG-n, test?: strict-xfail test}
outputs:
  ufo: null                            # when set, ufo_scope is required
  latex: "outputs/vertices.tex"
  vertices_md: "outputs/vertices.md"
  spectrum: "outputs/spectrum.md"
  stamp: "outputs/STAMP.json"
last_reviewed: 2026-09-16
reviewed_by: "<name>"
