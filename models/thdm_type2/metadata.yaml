schema_version: 1
id: thdm_type2
name: "Two-Higgs-doublet model, type II, CP-conserving, softly broken Z2"
parents: [sm]
problem_addressed: |
  The minimal extended Higgs sector with a charged Higgs, a CP-odd scalar and a
  second CP-even scalar, without tree-level flavour-changing neutral currents
  (natural flavour conservation through a Z2). Type II is the Yukawa pattern of
  the MSSM Higgs sector and the standard target of charged-Higgs, tan β and
  alignment-limit phenomenology. [physics judgment]
new_fields:
  - {name: H2, symbol: "\\Phi_2", spin: 0, su3: 1, su2: 2, u1y: "1/2", extra_charges: {Z2: -1}, real: false, chirality: null, generations: 1}
new_symmetries:
  - {name: Z2, kind: discrete, acts_on: [H2, uR], status: softly_broken, broken_by: "the dimension-two term −m12² (H1†H2 + h.c.) (the only Z2-odd term)"}
free_parameters:
  - {name: tanb,  tex: "\\tan\\beta",   mass_dim: 0, role: ratio of VEVs v2/v1}
  - {name: m12sq, tex: "m_{12}^2",      mass_dim: 2, role: soft Z2-breaking mass}
  - {name: lam1,  tex: "\\lambda_1",     mass_dim: 0, role: quartic}
  - {name: lam2,  tex: "\\lambda_2",     mass_dim: 0, role: quartic}
  - {name: lam3,  tex: "\\lambda_3",     mass_dim: 0, role: quartic}
  - {name: lam4,  tex: "\\lambda_4",     mass_dim: 0, role: quartic}
  - {name: lam5,  tex: "\\lambda_5",     mass_dim: 0, role: quartic}
benchmark:
  # Inputs, not measurements. Electroweak block as in models/sm. The λ_i were
  # obtained by inverting the physical point (m_h, m_H, m_A, m_H+) = (125, 300,
  # 300, 320) GeV, tan β = 2, cos(β−α) = 0.1, m12² = 30000 GeV² with the
  # standard tree-level relations (Gunion–Haber Eqs. 10–13 with λ6 = λ7 = 0);
  # the spectrum in outputs/spectrum.md is feynlag's re-derivation from these λ_i.
  gw: 0.65322889878251
  g1: 0.3491928465111313
  gs: 1.2177157847767197
  v: 246.2184581018163
  MT: 173.0
  MB: 4.7
  MTA: 1.777
  WZ: 2.4952
  WW: 2.0850
  WH: 0.00407
  WT: 1.4915
  WHH: 1.0      # placeholder width inputs for the UFO card; compute with MadGraph before use
  WA0: 1.0
  WHp: 1.0
  tanb: 2.0
  m12sq: 30000.0
  lam1: 1.698922
  lam2: 0.206728
  lam3: 1.121888
  lam4: -0.656511
  lam5: -0.247429
key_results:
  - {statement: "m11² = m12² tβ − ½v²(λ1 cβ² + λ345 sβ²) and 1↔2 (tadpoles)", test: "tests/test_l0_l1.py::test_tadpoles_gunion_haber_eq6_eq7"}
  - {statement: "m_A² = m12²/(sβcβ) − λ5 v², m_H±² = m_A² + ½v²(λ5 − λ4)", test: "tests/test_l0_l1.py::test_mA_mHp_gunion_haber_eq10_eq11"}
  - {statement: "hVV = SM × sin(β−α), HVV = SM × cos(β−α), no AVV", test: "tests/test_l2_literature.py::test_hVV_HVV_sin_cos_beta_minus_alpha"}
  - {statement: "type-II ξ factors: ξ_h^u = cα/sβ, ξ_h^{d,ℓ} = −sα/cβ, ξ_H^u = sα/sβ, ξ_H^{d,ℓ} = cα/cβ, ξ_A^u = cotβ, ξ_A^{d,ℓ} = tanβ", test: "tests/test_l2_literature.py::test_neutral_yukawa_xi_factors_table2"}
  - {statement: "H⁺ t̄ b ∝ (√2/v)(m_t cotβ P_L + m_b tanβ P_R), H⁺ ν̄ τ ∝ (√2/v) m_τ tanβ P_R", test: "tests/test_l2_literature.py::test_charged_higgs_yukawa_eq16"}
maturity_level: 3
maturity_evidence:
  L0: ["tests/test_l0_l1.py::test_validate_invariance_and_anomalies", "tests/test_l0_l1.py::test_z2_softly_broken_only_by_m12sq"]
  L1: ["tests/test_l0_l1.py::test_tadpoles_gunion_haber_eq6_eq7", "tests/test_l0_l1.py::test_mass_blocks", "tests/test_l0_l1.py::test_spectrum_and_rotations_at_benchmark", "tests/test_l0_l1.py::test_goldstone_count_and_gauge_masses", "tests/test_l0_l1.py::test_fermion_masses"]
  L2: ["tests/test_l0_l1.py::test_mA_mHp_gunion_haber_eq10_eq11", "tests/test_l2_literature.py::test_hVV_HVV_sin_cos_beta_minus_alpha", "tests/test_l2_literature.py::test_neutral_yukawa_xi_factors_table2", "tests/test_l2_literature.py::test_charged_higgs_yukawa_eq16", "tests/test_l2_literature.py::test_alignment_limit_recovers_sm_h"]
  L3: ["tests/test_l3_ufo.py::test_ufo_roundtrip"]
  L4: []
literature_checks:
  - {quantity: "tadpole (minimum) conditions", ref: gunion2003, where: "Eqs. (6), (7) with λ6 = λ7 = 0 (checked on the arXiv text, 2026-09-16)", test: "tests/test_l0_l1.py::test_tadpoles_gunion_haber_eq6_eq7"}
  - {quantity: "CP-even mass matrix", ref: branco2012, where: "Eq. (7); equivalently Gunion–Haber Eqs. (12), (13)", test: "tests/test_l0_l1.py::test_mass_blocks"}
  - {quantity: "m_A², m_H±²", ref: gunion2003, where: "Eqs. (10), (11). NB: Branco et al. Eqs. (5)–(6) as extracted from the arXiv PDF read '−2λ5' and '−λ4 − λ5' with the same potential normalisation; we match Gunion–Haber and feynlag's own pinned 2HDM tests — TODO(verify) the Branco normalisation against the published version", test: "tests/test_l0_l1.py::test_mA_mHp_gunion_haber_eq10_eq11"}
  - {quantity: "mass eigenstates (H, h) = R(α)(ρ1, ρ2), m_H ≥ m_h", ref: gunion2003, where: "Eqs. (14)–(17)", test: "tests/test_l0_l1.py::test_spectrum_and_rotations_at_benchmark"}
  - {quantity: "hVV = sin(β−α) × SM, HVV = cos(β−α) × SM, AVV = 0", ref: branco2012, where: "statement following Table 2", test: "tests/test_l2_literature.py::test_hVV_HVV_sin_cos_beta_minus_alpha"}
  - {quantity: "neutral-Higgs Yukawa ξ factors, type II", ref: branco2012, where: "Eq. (16) and Table 2 (type II column)", test: "tests/test_l2_literature.py::test_neutral_yukawa_xi_factors_table2"}
  - {quantity: "charged-Higgs Yukawa", ref: branco2012, where: "Eq. (16), second line (with V_ud → 1)", test: "tests/test_l2_literature.py::test_charged_higgs_yukawa_eq16"}
references:
  - {key: branco2012, authors: "G. C. Branco, P. M. Ferreira, L. Lavoura, M. N. Rebelo, M. Sher, J. P. Silva", title: "Theory and phenomenology of two-Higgs-doublet models", venue: "Phys. Rept. 516 (2012) 1 — TODO(verify) journal details", arxiv: "1106.0034", inspire: null, doi: null}
  - {key: gunion2003, authors: "J. F. Gunion, H. E. Haber", title: "The CP-conserving two-Higgs-doublet model: the approach to the decoupling limit", venue: "Phys. Rev. D 67 (2003) 075019 — TODO(verify) journal details", arxiv: "hep-ph/0207010", inspire: null, doi: null}
feynlag_gaps: [FG-2]
outputs: {ufo: "outputs/THDM_TYPE2_UFO", latex: "outputs/vertices.tex", spectrum: "outputs/spectrum.md", stamp: "outputs/STAMP.json"}
last_reviewed: 2026-09-16
reviewed_by: "Moises Zeleny (with Claude)"
