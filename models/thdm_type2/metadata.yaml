schema_version: 2
id: thdm_type2
name: "Two-Higgs-doublet model, type II, CP-conserving, softly broken Z2"
parents:
  - {id: sm, relation: replaces_sector, sector: higgs}
problem_addressed: |
  The minimal extended Higgs sector with a charged Higgs, a CP-odd scalar and a
  second CP-even scalar, without tree-level flavour-changing neutral currents
  (natural flavour conservation through a Z2). Type II is the Yukawa pattern of
  the MSSM Higgs sector and the standard target of charged-Higgs, tan β and
  alignment-limit phenomenology. [physics judgment]
new_fields:
  - name: H2
    symbol: "\\Phi_2"
    spin: "0"
    su3: 1
    su2: 2
    u1y: "1/2"
    extra_charges: [{group: Z2, kind: discrete, charge: "1"}]
    real: false
    chirality: null
    generations: 1
new_symmetries:
  - {name: Z2, kind: discrete, acts_on: [H2, uR], status: softly_broken, broken_by: "the dimension-two term −m12² (H1†H2 + h.c.) (the only Z2-odd term)"}
free_parameters:
  - {name: tanb,  tex: "\\tan\\beta",   mass_dim: 0, role: ratio of VEVs v2/v1}
  - {name: m12sq, tex: "m_{12}^2",      mass_dim: 2, role: soft Z2-breaking mass}
  - {name: lam1,  tex: "\\lambda_1",     mass_dim: 0, role: quartic}
  - {name: lam2,  tex: "\\lambda_2",     mass_dim: 0, role: quartic}
  - {name: lam3,  tex: "\\lambda_3",     mass_dim: 0, role: quartic}
  - {name: lam4,  tex: "\\lambda_4",     mass_dim: 0, role: quartic}
  - {name: lam5,  tex: "\\lambda_5",     mass_dim: 0, role: quartic}
benchmark:
  description: "Electroweak block as in models/sm. The lam_i are the tree-level inversion of derived_from.physical (Gunion–Haber Eqs. 10–13 with lambda6 = lambda7 = 0), rounded to 6 decimals; the test named there checks that feynlag re-derives the physical point."
  inputs:
    gw: 0.65322889878251
    g1: 0.3491928465111313
    gs: 1.2177157847767197
    v: 246.2184581018163
    MT: 173.0
    MB: 4.7
    MTA: 1.777
    WZ: 2.4952
    WW: 2.0850
    WH: 0.00407
    WT: 1.4915
    WHH: 1.0
    WA0: 1.0
    WHp: 1.0
    tanb: 2.0
    m12sq: 30000.0
    lam1: 1.698922
    lam2: 0.206728
    lam3: 1.121888
    lam4: -0.656511
    lam5: -0.247429
  placeholders: [WHH, WA0, WHp]
  derived_from:
    description: "physical-basis benchmark: masses in GeV, cos(beta - alpha) in feynlag's alpha convention"
    physical: {MH0: 125.0, MHH: 300.0, MA0: 300.0, MHp: 320.0, tanb: 2.0, cos_beta_minus_alpha: 0.1, m12sq: 30000.0}
    test: "tests/test_l0_l1.py::test_benchmark_matches_physical_inputs"
key_results:
  - {statement: "m11² = m12² tβ − ½v²(λ1 cβ² + λ345 sβ²) and 1↔2 (tadpoles)", test: "tests/test_l0_l1.py::test_tadpoles_gunion_haber_eq6_eq7"}
  - {statement: "m_A² = m12²/(sβcβ) − λ5 v², m_H±² = m_A² + ½v²(λ5 − λ4)", test: "tests/test_l0_l1.py::test_mA_mHp_gunion_haber_eq10_eq11"}
  - {statement: "hVV = SM × sin(β−α), HVV = SM × cos(β−α), no AVV", test: "tests/test_l2_literature.py::test_hVV_HVV_sin_cos_beta_minus_alpha"}
  - {statement: "type-II ξ factors: ξ_h^u = cα/sβ, ξ_h^{d,ℓ} = −sα/cβ, ξ_H^u = sα/sβ, ξ_H^{d,ℓ} = cα/cβ, ξ_A^u = cotβ, ξ_A^{d,ℓ} = tanβ", test: "tests/test_l2_literature.py::test_neutral_yukawa_xi_factors_table2"}
  - {statement: "H⁺ t̄ b ∝ (√2/v)(m_t cotβ P_L + m_b tanβ P_R), H⁺ ν̄ τ ∝ (√2/v) m_τ tanβ P_R", test: "tests/test_l2_literature.py::test_charged_higgs_yukawa_eq16"}
maturity_level: 3
maturity_evidence:
  L0: ["tests/test_l0_l1.py::test_validate_invariance_and_anomalies", "tests/test_l0_l1.py::test_z2_softly_broken_only_by_m12sq"]
  L1: ["tests/test_l0_l1.py::test_tadpoles_gunion_haber_eq6_eq7", "tests/test_l0_l1.py::test_mass_blocks", "tests/test_l0_l1.py::test_spectrum_and_rotations_at_benchmark", "tests/test_l0_l1.py::test_goldstone_count_and_gauge_masses", "tests/test_l0_l1.py::test_fermion_masses", "tests/test_l0_l1.py::test_benchmark_matches_physical_inputs"]
  L2: ["tests/test_l0_l1.py::test_mA_mHp_gunion_haber_eq10_eq11", "tests/test_l2_literature.py::test_hVV_HVV_sin_cos_beta_minus_alpha", "tests/test_l2_literature.py::test_neutral_yukawa_xi_factors_table2", "tests/test_l2_literature.py::test_charged_higgs_yukawa_eq16", "tests/test_l2_literature.py::test_charged_higgs_quark_lepton_same_sign_derived", "tests/test_l2_literature.py::test_charged_higgs_quark_lepton_relative_sign_eq16", "tests/test_l2_literature.py::test_mA_mHp_independent_of_feynlag", "tests/test_l2_literature.py::test_alignment_limit_recovers_sm_h"]
  L3: ["tests/test_l3_ufo.py::test_ufo_roundtrip"]
  L4: []
slow_evidence: []
literature_checks:
  - {quantity: "tadpole (minimum) conditions", ref: gunion2003, location: {equation: "(6), (7)", note: "with λ6 = λ7 = 0"}, source_version: "arXiv:hep-ph/0207010v5", checked_on: 2026-09-16, test: "tests/test_l0_l1.py::test_tadpoles_gunion_haber_eq6_eq7"}
  - {quantity: "CP-even mass block", ref: branco2012, location: {equation: "(7)", note: "CP-odd and charged prefactors of Eqs. (5)-(6): discrepancy D-2; the blocks are checked against Gunion–Haber in the same test"}, source_version: "arXiv:1106.0034v3", checked_on: 2026-09-16, test: "tests/test_l0_l1.py::test_mass_blocks"}
  - {quantity: "m_A², m_H±²", ref: gunion2003, location: {equation: "(10), (11)"}, source_version: "arXiv:hep-ph/0207010v5", checked_on: 2026-09-16, test: "tests/test_l0_l1.py::test_mA_mHp_gunion_haber_eq10_eq11"}
  - {quantity: "mass eigenstates (H, h) = R(α)(ρ1, ρ2), m_H ≥ m_h", ref: gunion2003, location: {equation: "(14)-(17)"}, source_version: "arXiv:hep-ph/0207010v5", checked_on: 2026-09-16, test: "tests/test_l0_l1.py::test_spectrum_and_rotations_at_benchmark"}
  - {quantity: "hVV = sin(β−α) × SM, HVV = cos(β−α) × SM, AVV = 0", ref: branco2012, location: {section: "2.1", note: "sentence following Table 2"}, source_version: "arXiv:1106.0034v3", checked_on: 2026-09-16, test: "tests/test_l2_literature.py::test_hVV_HVV_sin_cos_beta_minus_alpha"}
  - {quantity: "neutral-Higgs Yukawa ξ factors, type II", ref: branco2012, location: {equation: "(16)", table: "2 (type II column)"}, source_version: "arXiv:1106.0034v3", checked_on: 2026-09-16, test: "tests/test_l2_literature.py::test_neutral_yukawa_xi_factors_table2"}
  - {quantity: "charged-Higgs Yukawa magnitudes and quark chirality relative sign", ref: branco2012, location: {equation: "(16)", note: "second line, V_ud → 1; overall sign: discrepancy D-3"}, source_version: "arXiv:1106.0034v3", checked_on: 2026-09-16, test: "tests/test_l2_literature.py::test_charged_higgs_yukawa_eq16"}
  - {quantity: "quark–lepton relative sign of the charged-Higgs Yukawas", ref: branco2012, location: {equation: "(16)", note: "common minus in front of the bracket; discrepancy D-1 (resolved)"}, source_version: "arXiv:1106.0034v3", checked_on: 2026-09-16, test: "tests/test_l2_literature.py::test_charged_higgs_quark_lepton_relative_sign_eq16"}
  - {quantity: "charged-Higgs Yukawa line and type-II ξ factors", ref: aoki2009, location: {equation: "(6)", table: "II"}, source_version: "arXiv:0902.4665v3", checked_on: 2026-09-16, test: "tests/test_l2_literature.py::test_charged_higgs_quark_lepton_relative_sign_eq16"}
  - {quantity: "m_A², m_H±² from the potential, independent of feynlag", ref: gunion2003, location: {equation: "(10), (11)", note: "derived from Branco et al. Eq. (2) with plain SymPy"}, source_version: "arXiv:hep-ph/0207010v5", checked_on: 2026-09-16, test: "tests/test_l2_literature.py::test_mA_mHp_independent_of_feynlag"}
discrepancies:
  - id: D-1
    quantity: "relative sign of the ū d H⁺ and ν̄ ℓ H⁺ Yukawa terms"
    ref: branco2012
    location: {equation: "(16)", note: "second line; same structure in Aoki et al. Eq. (6)"}
    ours: "same sign for the two terms: +(√2/v) m_b tanβ (ū_L d_R) H⁺ and +(√2/v) m_τ tanβ (ν̄_L τ_R) H⁺"
    theirs: "−{ (√2 V_ud/v) ū (m_u ξ_A^u P_L + m_d ξ_A^d P_R) d H⁺ + (√2 m_ℓ ξ_A^ℓ/v) ν̄_L ℓ_R H⁺ } + h.c. — also the same sign for the two terms"
    status: resolved
    test: "tests/test_l2_literature.py::test_charged_higgs_quark_lepton_relative_sign_eq16"
    note: "Not a discrepancy. The pilot transcription dropped the bracket after the leading minus in Eq. (16); in the pdftotext layout of arXiv v3 the bracket opens right after the minus and closes after the lepton term, and Aoki et al. arXiv:0902.4665v3 Eq. (6) is identical. Re-checked 2026-09-16."
  - id: D-2
    quantity: "λ-dependent prefactors of m_A² and m_H±²"
    ref: branco2012
    location: {equation: "(5), (6)", note: "and the inline formulas for m_+² and m_A² that follow them"}
    ours: "m_A² = [m12²/(v1v2) − λ5] v², m_H±² = [m12²/(v1v2) − (λ4+λ5)/2] v²"
    theirs: "m_A² = [m12²/(v1v2) − 2λ5] v², m_+² = [m12²/(v1v2) − λ4 − λ5] v²"
    status: open
    test: "tests/test_l2_literature.py::test_mA_mHp_branco_arxiv_text_eq5_6"
    note: "The printed formulas are inline text, identical in arXiv v1, v2 and v3, so this is not a PDF-extraction artefact. They are inconsistent with the paper's own potential, Eq. (2): a plain-SymPy derivation from Eq. (2) (test_mA_mHp_independent_of_feynlag), Gunion–Haber Eqs. (10)–(11), feynlag, and Branco's own CP-even block Eq. (7) all give the values under 'ours'. The published Phys. Rept. text could not be read (ScienceDirect returned HTTP 403 on 2026-09-16), so whether the typo survives in print is unknown."
  - id: D-3
    quantity: "overall sign of the charged-Higgs Yukawa line"
    ref: aoki2009
    location: {equation: "(4), (6)", note: "Branco et al. Eq. (16) has the same sign as Aoki Eq. (6)"}
    ours: "+(√2/v)(m_t cotβ P_L + m_b tanβ P_R) for ū d H⁺, derived from −y Q̄Φd with H1⁺ = cβ G⁺ − sβ H⁺"
    theirs: "−(√2/v)(m_u ξ_A^u P_L + m_d ξ_A^d P_R) with the same Eq. (4) definition of H⁺"
    status: convention
    note: "Equivalent to H⁺ → −H⁺, which changes no observable. Magnitudes, the chirality structure and the quark–lepton relative sign agree; the neutral h, H couplings agree including sign."
references:
  - key: branco2012
    kind: review
    authors: "G. C. Branco, P. M. Ferreira, L. Lavoura, M. N. Rebelo, M. Sher, J. P. Silva"
    title: "Theory and phenomenology of two-Higgs-doublet models"
    venue: "Phys. Rept. 516 (2012) 1"
    year: 2012
    arxiv: "1106.0034"
    inspire: "902365"
    doi: "10.1016/j.physrep.2012.02.002"
    verified_against: arxiv_text
    conventions_map:
      - {theirs: "Φ1, Φ2 with Φ_a = (φ_a⁺, (v_a + ρ_a + iη_a)/√2)", ours: "H1, H2 with components H1p, H10 → (v1 + H10_r + i H10_i)/√2"}
      - {theirs: "tan β = v2/v1 (Eq. 8)", ours: "tanb, beta = atan(tanb)", note: "identical"}
      - {theirs: "V_ud", ours: "1", note: "one generation, no CKM"}
  - key: gunion2003
    kind: article
    authors: "J. F. Gunion, H. E. Haber"
    title: "The CP conserving two Higgs doublet model: The Approach to the decoupling limit"
    venue: "Phys. Rev. D 67 (2003) 075019"
    year: 2003
    arxiv: "hep-ph/0207010"
    inspire: "589599"
    doi: "10.1103/PhysRevD.67.075019"
    verified_against: arxiv_text
    conventions_map:
      - {theirs: "λ6, λ7", ours: "0", note: "exact Z2 in the quartics"}
      - {theirs: "H = cα ρ1 + sα ρ2, h = −sα ρ1 + cα ρ2 (Eq. 14)", ours: "(H, h) = R(alpha)(H10_r, H20_r)", note: "identical; GH fix the branch by m_H ≥ m_h, feynlag's alpha = ½ atan(2M12/(M11−M22)) coincides when M11 > M22 (true at the benchmark)"}
  - key: aoki2009
    kind: article
    authors: "M. Aoki, S. Kanemura, K. Tsumura, K. Yagyu"
    title: "Models of Yukawa interaction in the two Higgs doublet model, and their collider phenomenology"
    venue: "Phys. Rev. D 80 (2009) 015017"
    year: 2009
    arxiv: "0902.4665"
    inspire: "814281"
    doi: "10.1103/PhysRevD.80.015017"
    verified_against: arxiv_text
    conventions_map:
      - {theirs: "Φ_i = (ω_i⁺, (v_i + h_i − i z_i)/√2) (Eq. 3)", ours: "H_i = (H_ip, (v_i + H_i0_r + i H_i0_i)/√2)", note: "η_i = −z_i"}
      - {theirs: "R(θ) = [[cθ, −sθ], [sθ, cθ]] with (ω1⁺, ω2⁺) = R(β)(ω⁺, H⁺) (Eqs. 4, 5)", ours: "(G⁺, H⁺) = rotation_2x2(β)(H1⁺, H2⁺) with rotation_2x2 = [[c, s], [−s, c]]", note: "the same field definition: ours is the inverse map"}
      - {theirs: "ξ factors, Table II", ours: "identical to Branco et al. Table 2 (type II row checked)"}
  - key: hhg2000
    kind: book
    authors: "J. F. Gunion, H. E. Haber, G. L. Kane, S. Dawson"
    title: "The Higgs Hunter's Guide"
    venue: "Front. Phys. 80 (2000) 1"
    year: 2000
    arxiv: null
    inspire: "279039"
    doi: "10.1201/9780429496448"
    verified_against: inspire_record
  - key: misiak2017
    kind: article
    authors: "M. Misiak, M. Steinhauser"
    title: "Weak radiative decays of the B meson and bounds on M_H± in the Two-Higgs-Doublet Model"
    venue: "Eur. Phys. J. C 77 (2017) 201"
    year: 2017
    arxiv: "1702.04571"
    inspire: "1513486"
    doi: "10.1140/epjc/s10052-017-4776-y"
    verified_against: inspire_record
feynlag_gaps: []
outputs:
  ufo: "outputs/THDM_TYPE2_UFO"
  ufo_scope:
    gauge: unitary
    vertex_classes: [FFS, FFV, SSS, SSSS, VSS, VVS, VVSS, VVV]
    omitted:
      - "VVVV: quartic gauge self-couplings in the rotated W/Z/photon basis"
      - "gluon and QCD vertices (quarks carry Identity colour flow only)"
      - "vertices with Goldstone legs (unitary gauge)"
      - "physical widths of H, A, H± (WHH, WA0, WHp are placeholder inputs)"
  latex: "outputs/vertices.tex"
  spectrum: "outputs/spectrum.md"
  stamp: "outputs/STAMP.json"
last_reviewed: 2026-09-17
reviewed_by: "Moises Zeleny (with Claude)"
