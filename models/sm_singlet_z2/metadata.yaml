schema_version: 1
id: sm_singlet_z2
name: "SM + real singlet scalar (Z2-symmetric, spontaneously broken)"
parents: [sm]
problem_addressed: |
  The simplest scalar portal: a real gauge-singlet scalar mixing with the Higgs.
  It is the minimal template for a second CP-even resonance, for a modified
  Higgs signal strength (universal cos θ suppression), and for portal models of
  hidden sectors and strong first-order electroweak phase transitions. [physics judgment]
new_fields:
  - {name: S, symbol: "S", spin: 0, su3: 1, su2: 1, u1y: 0, extra_charges: {Z2: -1}, real: true, chirality: null, generations: 1}
new_symmetries:
  - {name: Z2, kind: discrete, acts_on: [S], status: spontaneously_broken, broken_by: "<S> = v_S (domain walls are a known cosmological issue of this choice; physics judgment)"}
free_parameters:
  - {name: vS,    tex: "v_S",           mass_dim: 1, role: singlet VEV}
  - {name: lamS,  tex: "\\lambda_S",    mass_dim: 0, role: singlet quartic}
  - {name: lamHS, tex: "\\lambda_{HS}", mass_dim: 0, role: portal coupling}
benchmark:
  # Inputs (not measurements). Electroweak block as in models/sm; singlet block
  # chosen so h1 is the lighter, SM-like state with small mixing.
  gw: 0.65322889878251
  g1: 0.3491928465111313
  gs: 1.2177157847767197
  v: 246.2184581018163
  MH: 125.0
  MT: 173.0
  MB: 4.7
  MTA: 1.777
  WZ: 2.4952
  WW: 2.0850
  WH: 0.00407
  WT: 1.4915
  vS: 500.0
  lamS: 0.3
  lamHS: 0.1
  WH2: 1.0       # placeholder width input for the UFO card; compute with MadGraph before use
key_results:
  - {statement: "μ² = λ v² + ½ λ_HS v_S², μ_S² = −λ_S v_S² − ½ λ_HS v²", test: "tests/test_l0_l1.py::test_tadpoles"}
  - {statement: "M² = [[2λv², λ_HS v v_S], [λ_HS v v_S, 2λ_S v_S²]]", test: "tests/test_l2_literature.py::test_mass_matrix_eq7"}
  - {statement: "tan 2θ = λ_HS v v_S/(λ v² − λ_S v_S²), m²_{1,2} = λv² + λ_S v_S² ∓ √((λv² − λ_S v_S²)² + (λ_HS v v_S)²)", test: "tests/test_l2_literature.py::test_mixing_angle_eq11_eq12"}
  - {statement: "every h1 (h2) coupling to SM particles = SM coupling × cos θ (−sin θ)", test: "tests/test_l2_literature.py::test_coupling_rescaling"}
maturity_level: 3
maturity_evidence:
  L0: ["tests/test_l0_l1.py::test_validate_gauge_hermiticity_dimension_anomalies", "tests/test_l0_l1.py::test_z2_invariance_of_every_non_kinetic_term"]
  L1: ["tests/test_l0_l1.py::test_tadpoles", "tests/test_l0_l1.py::test_cp_even_mass_matrix", "tests/test_l0_l1.py::test_spectrum_at_benchmark", "tests/test_l0_l1.py::test_goldstone_count_unchanged"]
  L2: ["tests/test_l2_literature.py::test_mass_matrix_eq7", "tests/test_l2_literature.py::test_mass_eigenvalues_eq8_eq9", "tests/test_l2_literature.py::test_mixing_angle_eq11_eq12", "tests/test_l2_literature.py::test_coupling_rescaling", "tests/test_l2_literature.py::test_lambda3_from_masses_eq13", "tests/test_l2_literature.py::test_decoupling_lamHS_to_zero"]
  L3: ["tests/test_l3_ufo.py::test_ufo_roundtrip"]
  L4: []
literature_checks:
  - {quantity: "CP-even mass matrix", ref: robens2015, where: "Eq. (7) (checked on the arXiv v2 text, 2026-09-16)", test: "tests/test_l2_literature.py::test_mass_matrix_eq7"}
  - {quantity: "mass eigenvalues", ref: robens2015, where: "Eqs. (8), (9); identical to Pruna–Robens Eqs. (6), (7)", test: "tests/test_l2_literature.py::test_mass_eigenvalues_eq8_eq9"}
  - {quantity: "mixing angle", ref: robens2015, where: "Eqs. (10)–(12) with α = −θ; Pruna–Robens Eqs. (8)–(10)", test: "tests/test_l2_literature.py::test_mixing_angle_eq11_eq12"}
  - {quantity: "cos α / sin α coupling suppression", ref: robens2015, where: "statement following Eq. (12); Pruna–Robens after Eq. (8)", test: "tests/test_l2_literature.py::test_coupling_rescaling"}
  - {quantity: "λ3 in terms of masses and angle", ref: robens2015, where: "Eq. (13); Pruna–Robens Eq. (11)", test: "tests/test_l2_literature.py::test_lambda3_from_masses_eq13"}
references:
  - {key: robens2015, authors: "T. Robens, T. Stefaniak", title: "Status of the Higgs Singlet Extension of the Standard Model after LHC Run 1", venue: "Eur. Phys. J. C 75 (2015) 104 — TODO(verify) journal details against INSPIRE", arxiv: "1501.02234", inspire: null, doi: null}
  - {key: pruna2013, authors: "G. M. Pruna, T. Robens", title: "The Higgs Singlet extension parameter space in the light of the LHC discovery", venue: "Phys. Rev. D 88 (2013) 115012 — TODO(verify) journal details against INSPIRE", arxiv: "1303.1150", inspire: null, doi: null}
feynlag_gaps: [FG-1, FG-2]
outputs: {ufo: "outputs/SM_SINGLET_Z2_UFO", latex: "outputs/vertices.tex", spectrum: "outputs/spectrum.md", stamp: "outputs/STAMP.json"}
last_reviewed: 2026-09-16
reviewed_by: "Moises Zeleny (with Claude)"
