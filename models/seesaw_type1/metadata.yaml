schema_version: 1
id: seesaw_type1
name: "Type-I seesaw (SM + one right-handed neutrino with a Majorana mass)"
parents: [sm]
problem_addressed: |
  Neutrino masses. A gauge-singlet ν_R with a Dirac Yukawa and a large Majorana
  mass M_R gives the light neutrino a naturally tiny Majorana mass
  m_ν ≈ −m_D²/M_R and a heavy Majorana partner N ≈ M_R whose couplings to W, Z, h
  are suppressed by the mixing V ≈ m_D/M_R. [physics judgment]
new_fields:
  - {name: nuR, symbol: "\\nu_R", spin: "1/2", su3: 1, su2: 1, u1y: 0, extra_charges: {}, real: false, chirality: R, generations: 1}
new_symmetries:
  - {name: "U(1)_L (lepton number, accidental in the SM)", kind: global, acts_on: [Ll, eR, nuR], status: explicitly_broken, broken_by: "the Majorana mass term −½ M_R ν_Rᵀ C ν_R (ΔL = 2)"}
free_parameters:
  - {name: yv, tex: "y_\\nu", mass_dim: 0, role: Dirac neutrino Yukawa}
  - {name: MR, tex: "M_R",    mass_dim: 1, role: right-handed Majorana mass (seesaw scale)}
benchmark:
  # Inputs, not measurements. Electroweak block as in models/sm. y_ν and M_R chosen
  # so that m_ν ≈ 0.03 eV with M_R = 1 TeV (m_D = y_ν v/√2 ≈ 0.17 MeV, V ≈ 1.7e-7).
  gw: 0.65322889878251
  g1: 0.3491928465111313
  gs: 1.2177157847767197
  v: 246.2184581018163
  MH: 125.0
  MT: 173.0
  MB: 4.7
  MTA: 1.777
  WZ: 2.4952
  WW: 2.0850
  WH: 0.00407
  WT: 1.4915
  yv: 1.0e-6
  MR: 1000.0
key_results:
  - {statement: "M_ν = [[0, m_D], [m_D, M_R]], m_D = y_ν v/√2, Takagi-diagonalised with U D Uᵀ = M_ν", test: "tests/test_l0_l1.py::test_takagi_spectrum_at_benchmark"}
  - {statement: "m_ν = m_D²/M_R (1 − m_D²/M_R² + …); m_N = M_R + O(m_D²/M_R)", test: "tests/test_l2_literature.py::test_seesaw_formula_vs_exact_eigenvalue"}
  - {statement: "W ℓ N = (g/√2)·V, Z ν N = (g_Z/2)·V, h ν N = y_ν/√2, with V ≈ m_D/M_R → 0 as M_R → ∞", test: "tests/test_l2_literature.py::test_W_coupling_eq_2_5"}
maturity_level: 2
maturity_evidence:
  L0: ["tests/test_l0_l1.py::test_validate_invariance_and_anomalies"]
  L1: ["tests/test_l0_l1.py::test_mass_matrix_entries", "tests/test_l0_l1.py::test_takagi_spectrum_at_benchmark", "tests/test_l0_l1.py::test_light_heavy_mixing_at_benchmark", "tests/test_l0_l1.py::test_goldstone_count_unchanged"]
  L2: ["tests/test_l2_literature.py::test_seesaw_formula_vs_exact_eigenvalue", "tests/test_l2_literature.py::test_W_coupling_eq_2_5", "tests/test_l2_literature.py::test_Z_coupling_eq_2_5", "tests/test_l2_literature.py::test_h_nu_N_coupling", "tests/test_l2_literature.py::test_decoupling_M_R_to_infinity"]
  L3: []
  L4: []
literature_checks:
  - {quantity: "seesaw light mass m_ν ≈ −m_D M_R⁻¹ m_Dᵀ", ref: minkowski1977, where: "the original seesaw papers (equation numbers TODO(verify)); the scaling m_ν ~ m_D²/M_N is also stated in Atre et al. below Eq. (2.5)", test: "tests/test_l2_literature.py::test_seesaw_formula_vs_exact_eigenvalue"}
  - {quantity: "W ℓ N coupling (g/√2) V_ℓN γ^μ P_L", ref: atre2009, where: "Eq. (2.5), first term (checked on the arXiv v2 text, 2026-09-16)", test: "tests/test_l2_literature.py::test_W_coupling_eq_2_5"}
  - {quantity: "Z ν N coupling (g/2cosθ_W) V_ℓN γ^μ P_L", ref: atre2009, where: "Eq. (2.5), second term; mixing relation Eq. (2.3)", test: "tests/test_l2_literature.py::test_Z_coupling_eq_2_5"}
  - {quantity: "V†V ≈ m_ν/M_N (decoupling)", ref: atre2009, where: "remark after Eq. (2.5)", test: "tests/test_l2_literature.py::test_decoupling_M_R_to_infinity"}
references:
  - {key: minkowski1977, authors: "P. Minkowski", title: "μ → eγ at a rate of one out of 10⁹ muon decays?", venue: "Phys. Lett. B 67 (1977) 421 — TODO(verify)", arxiv: null, inspire: null, doi: null}
  - {key: grs1979, authors: "M. Gell-Mann, P. Ramond, R. Slansky", title: "Complex spinors and unified theories", venue: "Supergravity (North-Holland, 1979) — TODO(verify)", arxiv: null, inspire: null, doi: null}
  - {key: yanagida1979, authors: "T. Yanagida", title: "Horizontal symmetry and masses of neutrinos", venue: "KEK workshop proceedings (1979) — TODO(verify)", arxiv: null, inspire: null, doi: null}
  - {key: mohapatra1980, authors: "R. N. Mohapatra, G. Senjanović", title: "Neutrino mass and spontaneous parity nonconservation", venue: "Phys. Rev. Lett. 44 (1980) 912 — TODO(verify)", arxiv: null, inspire: null, doi: null}
  - {key: atre2009, authors: "A. Atre, T. Han, S. Pascoli, B. Zhang", title: "The Search for Heavy Majorana Neutrinos", venue: "JHEP 05 (2009) 030 — TODO(verify) journal details", arxiv: "0901.3589", inspire: null, doi: null}
feynlag_gaps: [FG-3]
outputs: {ufo: null, latex: "outputs/vertices.tex", spectrum: "outputs/spectrum.md", stamp: "outputs/STAMP.json"}
