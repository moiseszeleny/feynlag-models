key_results:
  - {statement: "gauge invariant, hermitian, anomaly-free with the exact c (phi/Lambda)^n Yukawa operators", test: "tests/test_l0_l1.py::test_validate_exact_operators"}
  - {statement: "global U(1)_FN holds monomial by monomial (phi: +1, per-generation fermion charges, H: 0)", test: "tests/test_l0_l1.py::test_global_u1_fn_every_term"}
  - {statement: "M_f = (v/sqrt2) c^f_ij eps^n_ij, n_ij = q(F_L,i) - q(f_R,j), eps = v_phi/(sqrt2 Lambda)", test: "tests/test_l0_l1.py::test_fermion_mass_matrices"}
  - {statement: "four massless real scalars: G0, G+- (eaten) and the U(1)_FN Goldstone a", test: "tests/test_l0_l1.py::test_goldstone_count"}
  - {statement: "Y^f textures and det Y^f = det(c) eps^(sum of charges) reproduce LNS-2 Eqs. (2.6), (2.7), (2.19)", test: "tests/test_l2_literature.py::test_determinant_is_charge_sum_lns_eq_2_19"}
  - {statement: "m_i ~ v eps^n_ii and |V_ij| ~ eps^|q(Q_i)-q(Q_j)| as finite O(1) limits (LNS-2 Eqs. 2.3, 2.4)", test: "tests/test_l2_literature.py::test_ckm_scaling_lns_eq_2_3"}
  - {statement: "one-flavon couplings: -M_ij (h/v + n_ij (s + i a)/v_phi) dbar_L,i d_R,j (physics judgment, not from LNS)", test: "tests/test_l2_literature.py::test_flavon_couplings"}
