schema_version: 2
id: froggatt_nielsen
name: "SM + Froggatt-Nielsen flavon (global U(1)_FN, three generations)"
parents:
  - {id: sm_ckm, relation: replaces_sector, sector: yukawa}
problem_addressed: |
  The SM fits the charged-fermion masses and the CKM matrix with free Yukawas spanning
  more than five orders of magnitude. In the Froggatt-Nielsen mechanism a horizontal
  U(1)_FN, under which the generations carry different integer charges, forbids most
  renormalizable Yukawas. A flavon phi, charged under U(1)_FN, gets a vev, and the Yukawas
  come from higher-dimension operators c_ij (phi/Lambda)^n_ij, with O(1) coefficients and
  powers fixed by the charges: y_ij = c_ij eps^n_ij, eps = v_phi/(sqrt2 Lambda). Requested by
  feynlag-anomalies puzzles/flavor_puzzle (model_requests/froggatt_nielsen.md). [physics judgment]
new_fields:
  - name: phi
    symbol: "\\phi"
    spin: "0"
    su3: 1
    su2: 1
    u1y: "0"
    extra_charges: [{group: U1_FN, kind: global, charge: "1"}]
    real: false
    chirality: null
    generations: 1
new_symmetries:
  - {name: U1_FN, kind: global, acts_on: [phi, QL, uR, dR, Ll, eR], status: spontaneously_broken, broken_by: "<phi> = v_phi/sqrt2; the flavon phase a is an exact massless Goldstone (no explicit breaking is included; physics judgment). Fermion charges are per generation and are benchmark inputs qQ1..qe3; H is uncharged."}
free_parameters:
  - {name: vphi,    tex: "v_\\phi",          mass_dim: 1, role: flavon VEV}
  - {name: Lam,     tex: "\\Lambda",         mass_dim: 1, role: FN messenger scale}
  - {name: lamPhi,  tex: "\\lambda_\\phi",   mass_dim: 0, role: flavon quartic}
  - {name: lamHPhi, tex: "\\lambda_{H\\phi}", mass_dim: 0, role: Higgs-flavon portal}
benchmark:
  description: >-
    Inputs, not measurements. Electroweak block and widths as in models/sm.
    eps = vphi/(sqrt2 Lam) = 0.2, the order of the expansion parameter quoted by
    Leurer-Nir-Seiberg (hep-ph/9310320 Sec. 2.1, "lambda ~ 0.2"); Lam = 10 TeV is a placeholder.
    Quark FN charges are the LNS "master model", hep-ph/9310320 Eq. (2.5): H(Q) = (3,2,0),
    H(dbar) = (3,2,2), H(ubar) = (3,1,0), mapped as qQ = H(Q), qu = -H(ubar), qd = -H(dbar)
    (their S is our phi^*). Lepton charges copy the down sector (qL = qQ, qe = qd), a
    placeholder choice (physics judgment, not from the literature). The 27 complex c_ij =
    c_abs exp(i c_arg) are one seeded draw (numpy default_rng(20261005), |c| uniform in
    [0.5, 2], arg uniform in [0, 2pi)), not a fit. Flavon potential couplings are placeholders.
