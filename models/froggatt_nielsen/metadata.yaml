  L4: []
slow_evidence: []
literature_checks:
  - quantity: "FN charges of the benchmark (quark sector)"
    ref: lns1994
    location: {equation: "(2.5)", section: "2.1", note: "H(Q) = (3,2,0), H(dbar) = (3,2,2), H(ubar) = (3,1,0); mapped by conventions_map"}
    source_version: "arXiv:hep-ph/9310320v1 (20 Oct 1993)"
    checked_on: 2026-10-05
    test: "tests/test_l2_literature.py::test_benchmark_charges_are_lns_master_model"
  - quantity: "Yukawa texture Y_ij ~ lambda^(H(Q_i)+H(fbar_j)) and the resulting M^u, M^d powers"
    ref: lns1994
    location: {equation: "(2.2), (2.6)", section: "2.1", note: "exponents checked against rendered page images (pdftotext scrambles superscripts)"}
    source_version: "arXiv:hep-ph/9310320v1 (20 Oct 1993)"
    checked_on: 2026-10-05
    test: "tests/test_l2_literature.py::test_yukawa_texture_lns_eq_2_6"
  - quantity: "det M^f = lambda^(sum_i H(Q_i)+H(fbar_i)); det M^d ~ lambda^12, det M^u ~ lambda^9"
    ref: lns1994
    location: {equation: "(2.7), (2.19)", note: "exact here for additive non-negative exponents, det Y = det(c) eps^power"}
    source_version: "arXiv:hep-ph/9310320v1 (20 Oct 1993)"
    checked_on: 2026-10-05
    test: "tests/test_l2_literature.py::test_determinant_is_charge_sum_lns_eq_2_19"
  - quantity: "quark mass scaling m_i/m_j ~ lambda^(H(Q_i)-H(Q_j)+H(fbar_i)-H(fbar_j))"
    ref: lns1994
    location: {equation: "(2.4)", note: "checked as a finite O(1) limit of m_i/eps^n_ii as eps -> 0 over 20 random O(1) draws of c_ij"}
    source_version: "arXiv:hep-ph/9310320v1 (20 Oct 1993)"
    checked_on: 2026-10-05
    test: "tests/test_l2_literature.py::test_mass_scaling_lns_eq_2_4"
  - quantity: "CKM scaling |V_ij| ~ lambda^|H(Q_i)-H(Q_j)|"
    ref: lns1994
    location: {equation: "(2.3)", note: "finite O(1) limit of |V_ij|/eps^p as eps -> 0, 20 random draws; (2.3) and (2.4) stated there for i < j"}
    source_version: "arXiv:hep-ph/9310320v1 (20 Oct 1993)"
    checked_on: 2026-10-05
    test: "tests/test_l2_literature.py::test_ckm_scaling_lns_eq_2_3"
  - quantity: "|V_us|, |V_cb|, |V_ub| scaling and |V_ub| ~ |V_us V_cb|"
    ref: lns1993
    location: {equation: "(5.7), (5.8)", section: "5", note: "(5.7) is printed with square brackets, not absolute values; for H(Q) ordered as here they coincide"}
    source_version: "arXiv:hep-ph/9212278v1 (17 Dec 1992)"
    checked_on: 2026-10-05
    test: "tests/test_l2_literature.py::test_ckm_scaling_lns_eq_2_3"
discrepancies:
  - id: D-1
    quantity: "negative powers of the flavon (charge-violating entries with n_ij < 0)"
    ref: lns1994
    location: {section: "2.1, 4.1", note: "holomorphy statement in 2.1; Eq. (4.3) text: S^dagger cannot take part in the Yukawa sector"}
    ours: "phi^* to the power |n| for n < 0 (non-supersymmetric EFT, every U(1)_FN-invariant operator kept)"
    theirs: "entries with n < 0 vanish (supersymmetric, holomorphic superpotential); LNS-1 (5.6) notes powers of S^dagger in non-SUSY models but ignores them"
    status: convention
    note: "At the benchmark every n_ij >= 0, so the two agree there; a benchmark with negative n would differ from LNS by these entries."
