name: fast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - name: Fast tests (no MadGraph)
        run: uv run pytest -q -m "not slow"
      - name: Genealogy and outputs are up to date
        run: |
          uv run python scripts/build_genealogy.py --check
          uv run python scripts/build_outputs.py --check
