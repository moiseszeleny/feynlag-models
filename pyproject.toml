[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feynlag-models"
version = "0.1.0"
description = "A verified library of minimal Standard Model extensions built with feynlag"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moises Zeleny", email = "moiseszeleny@gmail.com" }]
dependencies = [
    # Exact pins: this repository is a verification record, not a library.
    "feynlag @ git+https://github.com/moiseszeleny/feynlag.git@410fc952c55cd9558120d1d55977e729cfc56b02",
    "sympy==1.14.0",
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "mpmath==1.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-timeout==2.3.1"]

[tool.setuptools.packages.find]
include = ["feynlag_models*", "models*"]

# the registry reads models/<id>/metadata.yaml at import time; a wheel keeps only .py files otherwise
[tool.setuptools.package-data]
models = ["*/metadata.yaml", "*/README.md", "*/NEXT_STEPS.md", "*/outputs/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "models"]
markers = [
    "slow: MadGraph or otherwise long-running checks (manual / release only)",
]
timeout = 1800
